module_name: RLToolsCommander
parameters:
    - group: RLtools
      definitions:
        RLT_ACTIV_SRC:
          description:
            short: Use AUX1 / MAVLink MANUAL_CONTROL button for activation
            long: |
              Whether to AUX1 or a MAVLink MANUAL_CONTROL button for the activation of the policy.
          type: enum
          values:
              0: AUX1
              1: MAVLink MANUAL_CONTROL
              2: AUTO (OFFBOARD above RLT_AUTO_ALT, gated by AUX1)
          default: 0
        RLT_AUTO_ALT:
          description:
            short: Altitude above which AUTO activation engages the policy
            long: |
              Only used when RLT_ACTIV_SRC is AUTO. The policy engages once the vehicle is in OFFBOARD,
              not landed, and above this altitude, and only while AUX1 is held high (if an RC is connected).
              Leaving OFFBOARD, releasing AUX1 or entering LAND/DESCEND/RTL disengages the policy and
              latches: restoring the condition does not re-engage it. Only disarming clears the latch.
          type: float
          unit: m
          default: 1.5
        RLT_ACTIV_BTN:
          description:
            short: RLtools policy activation button index
            long: |
              The button number (you can e.g. check it in QGroundControl under the Joystick section)
          type: int32
          default: 0
